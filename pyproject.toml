[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-source-mcp"
version = "0.1.0"
description = "MCP server for aggregating job listings from 104, Yourator, CakeResume, and LinkedIn."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9.0",
  "curl-cffi>=0.7.0",
  "playwright>=1.44.0",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
cookies = ["browser-cookie3>=0.19.1"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
job-source-mcp = "job_source_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
