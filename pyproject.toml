[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-source-mcp"
version = "0.1.0"
description = "MCP server for aggregating job listings from 104 and Yourator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9.0",
  "curl-cffi>=0.7.0",
  "playwright>=1.44.0",
]

[project.optional-dependencies]
cookies = ["browser-cookie3>=0.19.1"]

[project.scripts]
job-source-mcp = "job_source_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
